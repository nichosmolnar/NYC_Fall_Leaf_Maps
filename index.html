<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Autumn Leaf Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="map">
        <canvas id="street-canvas"></canvas>
        <canvas id="leaf-canvas"></canvas>
        <div id="map-status">Gathering leaves&hellip;</div>

        <div class="map-sidebar">
            <div class="map-panel">
                <h1>Autumn Leaves of New York:</h1>
                <h2>If you were walking down a street in 2015 New York, what shapes and colors would you see on the ground?</h2>

                <div class="input-container">
                    <input type="text" id="street-input" list="street-list" placeholder="Type or select a street...">
                    <datalist id="street-list"></datalist>
                </div>

                <div class="map-controls">
                    <div id="borough-toggles"></div>
                    <button id="reset-view" type="button">Reset view</button>
                </div>
            </div>

            <div id="selected-streets" class="map-panel" hidden></div>
        </div>
    </div>
    
    <div id="leaf-display"></div>
    
    <script src="colors.js"></script>
    <script src="leaf-gl.js"></script>
    <script src="map.js"></script>
    <script src="main.js"></script>
</body>
</html>
